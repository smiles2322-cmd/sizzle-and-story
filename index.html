<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sizzle &amp; Story</title>
<meta name="description" content="Sizzle & Story: a cozy anime cooking adventure. Cook the story. Make the meal.">
<meta name="theme-color" content="#f4a259">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="topbar" hidden>

  <button data-go="shop"><span aria-hidden="true">🛍️</span><span>Decorate</span></button>
  <button data-go="settings"><span aria-hidden="true">⚙️</span><span>Settings</span></button>
</nav>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>

<script src="recipes.js"></script>
<script src="app.js"></script>

</html>
